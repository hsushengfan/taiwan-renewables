# GitHub Actions：Supabase 備援收集與健康檢查（目前只能手動執行）
#
# 2026-11-13 起停用自動排程，原因：
#   - GitHub 的主機連台電網站常常逾時，這個備援從來沒有成功收到過資料
#   - GitHub 的免費排程很不準時，當警報也太慢
# 警報改用 Healthchecks.io（見 docs/supabase-setup.md 的「警報」）。
#
# 還留著手動執行的按鈕：在 GitHub 的 Actions 分頁選這個 workflow，按 Run workflow，
# 可以用來檢查資料庫的最新資料是不是超過 40 分鐘。
# 需要 GitHub repo 的 Settings → Secrets 裡有 SUPABASE_URL、SUPABASE_SERVICE_KEY。

name: Supabase 備援收集與健康檢查

on:
  workflow_dispatch: # 只能在 GitHub 網頁上按按鈕手動執行

permissions:
  contents: read # 只需要讀程式碼，不再 commit 資料

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  backup-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 下載 repo 內容
        uses: actions/checkout@v4

      - name: 備援收集 + 健康檢查
        run: python3 backup_collect.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
