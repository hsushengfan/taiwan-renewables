<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台灣電力概況 Taiwan Power Overview</title>
  <meta name="description" content="台灣各能源與各機組的即時發電量、容量因數與機組狀態，每 10 分鐘更新。Real-time generation by source and unit in Taiwan.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="#" class="home" data-t="title"></a></h1>
    <span class="sub" id="asof"></span>
    <div class="seg lang" role="group" aria-label="Language">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <div class="filters">
    <div class="seg" role="group" id="ranges">
      <button type="button" data-range="24h" data-t="range24h"></button>
      <button type="button" data-range="7d" data-t="range7d"></button>
      <button type="button" data-range="30d" data-t="range30d" disabled></button>
      <button type="button" data-range="1y" data-t="range1y" disabled></button>
    </div>
  </div>

  <!-- 這裡的內容由 js/views/ 裡的程式依照網址產生：總覽、能源類型頁、機組頁 -->
  <main id="view" class="view"></main>

  <footer>
    <p><span data-t="footSource"></span> ·
       <a href="https://data.gov.tw/dataset/8931" target="_blank" rel="noopener">data.gov.tw</a> ·
       <a href="https://github.com/hsushengfan/taiwan-renewables/blob/main/docs/methodology.md" target="_blank" rel="noopener" data-t="footMethod"></a></p>
    <p data-t="footNote"></p>
  </footer>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
